<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO de base -->
    <title>Garam Paparas — Jeu de cartes Kora</title>
    <meta
      name="description"
      content="Garam Paparas : jeu de plis africain (variante Kora). Solo contre 3 IA, mises, combos et règles spéciales. Jouez en local ou en ligne."
    />
    <meta name="keywords" content="Kora, Garam, Paparas, jeu de cartes, plis, Afrique, cartes" />
    <meta name="author" content="Garam Paparas" />
    <meta name="robots" content="index, follow" />

    <!-- Préconnexion polices (chargées via @import dans index.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Thème / système -->
    <meta name="theme-color" content="#0B0D10" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA / écran d'accueil -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paparas" />
    <meta name="application-name" content="Garam Paparas" />

    <!-- Icônes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Garam Paparas" />
    <meta property="og:title" content="Garam Paparas — Jeu de cartes Kora" />
    <meta
      property="og:description"
      content="Jeu de plis africain (variante Kora). Solo contre 3 IA, mises configurables, combos et victoires spéciales."
    />
    <!-- Remplacer par l’URL publique réelle une fois déployé -->
    <meta property="og:url" content="https://paparas.app/" />
    <meta property="og:image" content="https://paparas.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Garam Paparas — table de jeu Kora" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Garam Paparas — Jeu de cartes Kora" />
    <meta
      name="twitter:description"
      content="Jeu de plis africain (variante Kora). Solo contre 3 IA, mises, combos et règles spéciales."
    />
    <meta name="twitter:image" content="https://paparas.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Garam Paparas nécessite JavaScript pour fonctionner. Merci d'activer JavaScript dans votre
      navigateur.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
